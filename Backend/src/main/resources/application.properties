spring.application.name=musicology-guesser-backend

# Content catalogue on disk. Relative to the working directory, so this resolves when the app is
# started from the Backend folder; override with an absolute path if you run it from elsewhere.
app.data-dir=${DATA_DIR:data}

# Prefix for manuscript URLs handed to the frontend. Set to "" to emit relative URLs instead.
app.media-base-url=${MEDIA_BASE_URL:http://localhost:8080}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

# Sessions are in-memory, so they need a ceiling. A session older than the TTL is evicted and
# reads as SESSION_NOT_FOUND; the cap drops the oldest sessions once it is reached.
app.session-ttl=${SESSION_TTL:2h}
app.max-sessions=${MAX_SESSIONS:500}
